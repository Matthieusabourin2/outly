<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <!--
      HTML template for the web export (web.output "single"): Expo CLI reads public/index.html
      instead of its default template, fills in the language and the title (first occurrence
      of each placeholder only: never write them in this comment),
      then adds theme-color (from app.json web.themeColor), the favicon and the JS bundle.
      See docs/DEPLOY.md.
    -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Outly" />
    <!-- Link previews (WhatsApp, iMessage, Instagram, Messenger): absolute URLs required. -->
    <meta name="description" content="Join the Outly list and skip the queue with your Outly pass. Sydney." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Outly" />
    <meta property="og:title" content="Outly · Good times, anytime." />
    <meta property="og:description" content="Join the Outly list and skip the queue with your Outly pass. Sydney." />
    <meta property="og:url" content="https://outly-sydney.com" />
    <meta property="og:image" content="https://outly-sydney.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="outly. Good times, anytime." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* Outly night background (packages/ui colors.background): no white flash before the app loads */
        background-color: #0B0B1E;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run Outly.
    </noscript>
    <div id="root"></div>
  </body>
</html>
