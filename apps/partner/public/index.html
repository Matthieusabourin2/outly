<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <!--
      HTML template for the web export (web.output "single"): Expo CLI reads public/index.html
      instead of its default template, fills in the language and the title (first occurrence
      of each placeholder only: never write them in this comment),
      then adds theme-color (from app.json web.themeColor), the favicon and the JS bundle.
      See docs/DEPLOY.md.
    -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Outly Staff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* Outly night background (packages/ui colors.background): no white flash before the app loads */
        background-color: #0B0B1E;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run Outly Staff.
    </noscript>
    <div id="root"></div>
  </body>
</html>
